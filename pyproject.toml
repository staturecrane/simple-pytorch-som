[project]
name = "som"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "click>=8.5.0",
    "diffusers>=0.42.0",
    "ruff>=0.17.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]

[project.scripts]
som = "som:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
]
